<!-- PWA CONFIG -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e94560">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

<!-- STYLE PWA & BOUTONS -->
<style>
  /* BOUTON INSTALLATION PWA */
  .pwa-install-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, #e94560, #d43a55);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    z-index: 1000;
    transition: all 0.3s;
    display: none;
  }
  
  .pwa-install-btn.show {
    display: block;
  }
  
  .pwa-install-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
  }

  /* BOUTONS INTERACTIFS */
  .interactive-btn {
    background: linear-gradient(135deg, #5865F2, #7983f5);
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin: 10px;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
  }
  
  .interactive-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
  }
  
  .interactive-btn:active {
    transform: translateY(-1px);
  }
  
  .btn-success {
    background: linear-gradient(135deg, #4CAF50, #45a049);
  }
  
  .btn-warning {
    background: linear-gradient(135deg, #ff9800, #e68900);
  }
  
  /* ANIMATIONS */
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  
  .pulse {
    animation: pulse 2s infinite;
  }
  
  /* STATS COUNTER */
  .stat-number {
    font-size: 2.5rem;
    font-weight: bold;
    color: #e94560;
    transition: all 0.5s;
  }
  
  /* TOURNAMENT BRACKET */
  .bracket-match {
    background: rgba(30, 30, 46, 0.8);
    padding: 15px;
    margin: 10px 0;
    border-radius: 8px;
    border-left: 4px solid #e94560;
    transition: all 0.3s;
    cursor: pointer;
  }
  
  .bracket-match:hover {
    transform: translateX(5px);
    background: rgba(40, 40, 60, 0.9);
  }
</style>

<!-- SECTION BOUTONS INTERACTIFS -->
<section style="padding: 40px 0; text-align: center;">
  <h2>🚀 Actions Rapides</h2>
  <div style="margin: 20px 0;">
    <button class="interactive-btn pulse" onclick="joinTournament()">
      🎮 Rejoindre Tournoi
    </button>
    
    <button class="interactive-btn btn-success" onclick="showStats()">
      📊 Voir Stats
    </button>
    
    <button class="interactive-btn btn-warning" onclick="simulateBattle()">
      ⚔️ Simuler Combat
    </button>
    
    <button class="interactive-btn" onclick="shareServer()">
      📣 Partager Serveur
    </button>
  </div>
</section>

<!-- SECTION STATS LIVE -->
<section style="padding: 40px 0; text-align: center; background: rgba(0,0,0,0.3);">
  <h2>📈 Statistiques en Direct</h2>
  <div style="display: flex; justify-content: center; gap: 30px; margin: 30px 0;">
    <div>
      <div class="stat-number" id="onlineCount">72</div>
      <div>En Ligne</div>
    </div>
    <div>
      <div class="stat-number" id="tournamentCount">3</div>
      <div>Tournois Actifs</div>
    </div>
    <div>
      <div class="stat-number" id="battleCount">156</div>
      <div>Combats Today</div>
    </div>
  </div>
</section>

<!-- SECTION SIMULATION TOURNOI -->
<section style="padding: 40px 0;">
  <h2 style="text-align: center;">🏆 Arbre du Tournoi</h2>
  <div style="max-width: 600px; margin: 0 auto;">
    <div class="bracket-match" onclick="showMatchDetails(1)">
      <strong>Match 1:</strong> SonGoku vs Vegeta
      <div style="color: #b8b8b8; font-size: 0.9em;">En attente...</div>
    </div>
    
    <div class="bracket-match" onclick="showMatchDetails(2)">
      <strong>Match 2:</strong> Freezer vs Cell  
      <div style="color: #b8b8b8; font-size: 0.9em;">En cours...</div>
    </div>
    
    <div class="bracket-match" onclick="showMatchDetails(3)">
      <strong>Match 3:</strong> Boo vs Sangohan
      <div style="color: #4CAF50; font-size: 0.9em;">Terminé - Boo gagne!</div>
    </div>
  </div>
</section>
<!-- BOUTON INSTALLATION PWA -->
<button class="pwa-install-btn" id="installButton">
  📱 Installer l'App
</button>

<!-- SCRIPT PWA + INTERACTIONS -->
<script>
  // === PWA FUNCTIONALITY ===
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('🔄 PWA Ready!'))
      .catch(err => console.log('❌ PWA Error:', err));
  }

  let deferredPrompt;
  const installButton = document.getElementById('installButton');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installButton.classList.add('show');
  });

  installButton.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    
    if (outcome === 'accepted') {
      installButton.textContent = '✅ Installé!';
      installButton.style.background = '#4CAF50';
    }
    
    deferredPrompt = null;
    setTimeout(() => installButton.classList.remove('show'), 3000);
  });

  // === INTERACTIVE BUTTON FUNCTIONS ===
  function joinTournament() {
    const btn = event.target;
    btn.innerHTML = '🎮 Inscription...';
    btn.disabled = true;
    
    setTimeout(() => {
      btn.innerHTML = '✅ Inscrit!';
      btn.style.background = 'linear-gradient(135deg, #4CAF50, #45a049)';
      alert('🎉 Bienvenue dans le tournoi! Vérifiez vos MP Discord.');
    }, 1500);
  }

  function showStats() {
    // Animation des compteurs
    animateCounter('onlineCount', 72, 85, 2000);
    animateCounter('tournamentCount', 3, 5, 1500); 
    animateCounter('battleCount', 156, 189, 2500);
    
    alert('📈 Statistiques mises à jour!');
  }

  function simulateBattle() {
    const fighters = ['SonGoku', 'Vegeta', 'Freezer', 'Cell', 'Boo', 'Sangohan'];
    const player1 = fighters[Math.floor(Math.random() * fighters.length)];
    const player2 = fighters[Math.floor(Math.random() * fighters.length)];
    const winner = Math.random() > 0.5 ? player1 : player2;
    
    alert(`⚔️ COMBAT SIMULÉ:\n${player1} vs ${player2}\n🎊 VAINQUEUR: ${winner}`);
  }

  function shareServer() {
    const inviteLink = 'https://discord.gg/ssj3botz';
    
    if (navigator.share) {
      navigator.share({
        title: 'SSJ3 BOT-Z Discord',
        text: 'Rejoins le serveur Dragon Ball!',
        url: inviteLink
      });
    } else {
      navigator.clipboard.writeText(inviteLink);
      alert('📋 Lien Discord copié! Collez-le à vos amis.');
    }
  }

  function showMatchDetails(matchId) {
    const details = [
      "SonGoku (SSJ3) vs Vegeta (SSG)\n📍 Stage: Namek\n⏰ Prévu: 20:00",
      "Freezer (Final) vs Cell (Parfait)\n📍 Stage: Cell Games\n🔥 En cours!",
      "Boo (Maléfique) vs Sangohan (Ultimate)\n🎊 Terminé: Boo gagne 3-2"
    ];
    
    alert(`📋 DÉTAILS MATCH ${matchId}:\n${details[matchId-1]}`);
  }

  function animateCounter(elementId, start, end, duration) {
    const element = document.getElementById(elementId);
    let startTimestamp = null;
    
    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      const value = Math.floor(progress * (end - start) + start);
      
      element.textContent = value;
      
      if (progress < 1) {
        window.requestAnimationFrame(step);
      }
    };
    
    window.requestAnimationFrame(step);
  }

  // Stats auto-update every 30 seconds
  setInterval(() => {
    const randomUpdate = Math.floor(Math.random() * 10) + 1;
    const current = parseInt(document.getElementById('battleCount').textContent);
    document.getElementById('battleCount').textContent = current + randomUpdate;
  }, 30000);
</script>
